name: Deploy production site to gh-pages

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: gh-pages-publish
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          path: main

      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages

      - name: Sync site files into gh-pages root (keep pr-preview/ intact)
        run: |
          cp main/index.html gh-pages/index.html
          cp main/README.md gh-pages/README.md
          cp main/LICENSE gh-pages/LICENSE
          touch gh-pages/.nojekyll

      - name: Commit and push if changed
        working-directory: gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A -- index.html README.md LICENSE .nojekyll
          if git diff --cached --quiet; then
            echo "Geen wijziging"
            exit 0
          fi
          git commit -m "Deploy production van main@${GITHUB_SHA::7}"
          for i in 1 2 3 4 5; do
            if git push; then
              echo "Gepusht"
              exit 0
            fi
            echo "Push afgewezen (poging $i) — gh-pages is intussen bijgewerkt, opnieuw proberen"
            git fetch origin gh-pages
            git rebase origin/gh-pages
            sleep 3
          done
          echo "::error::Push naar gh-pages bleef mislukken na 5 pogingen"
          exit 1
