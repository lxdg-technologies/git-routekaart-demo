name: Promote tested version to production

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type PROMOTE to publish the current test version to production
        required: true
        type: string
      expected_test_sha:
        description: Optional full test SHA to guard against promoting a newer version
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: gh-pages-environments
  cancel-in-progress: false

jobs:
  promote-production:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://lxdg-technologies.github.io/git-routekaart-demo/
    steps:
      - name: Checkout deployment branch
        uses: actions/checkout@v6
        with:
          ref: gh-pages
          path: site

      - name: Verify conscious promotion
        shell: bash
        env:
          CONFIRM: ${{ inputs.confirm }}
          EXPECTED_TEST_SHA: ${{ inputs.expected_test_sha }}
        run: |
          set -euo pipefail
          if [ "$CONFIRM" != "PROMOTE" ]; then
            echo "::error::Confirmation must be exactly PROMOTE"
            exit 1
          fi
          test -f site/test/environment.json
          test_sha="$(python3 -c 'import json; print(json.load(open("site/test/environment.json"))["sha"])')"
          if [ -n "$EXPECTED_TEST_SHA" ] && [ "$EXPECTED_TEST_SHA" != "$test_sha" ]; then
            echo "::error::Test now points to $test_sha, not $EXPECTED_TEST_SHA"
            exit 1
          fi
          printf 'TEST_SHA=%s\n' "$test_sha" >> "$GITHUB_ENV"

      - name: Copy the exact tested version to production
        shell: bash
        run: |
          set -euo pipefail
          cp site/test/index.html site/index.html
          cp site/test/README.md site/README.md
          cp site/test/LICENSE site/LICENSE
          python3 - <<'PY'
          import json
          from pathlib import Path

          test = json.loads(Path("site/test/environment.json").read_text())
          production = {
              "environment": "production",
              "promoted_from": "test",
              "branch": test["branch"],
              "sha": test["sha"],
          }
          Path("site/environment.json").write_text(json.dumps(production, separators=(",", ":")) + "\n")
          PY
          touch site/.nojekyll

      - name: Publish production if changed
        working-directory: site
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- index.html README.md LICENSE environment.json .nojekyll
          if git diff --cached --quiet; then
            echo "Production already contains test@$TEST_SHA"
            exit 0
          fi
          git commit -m "Promote test@${TEST_SHA::7} to production"
          git push origin gh-pages
