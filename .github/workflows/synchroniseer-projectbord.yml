name: Synchroniseer ProjectV2-bord

on:
  # Deze events geven tijdens het werk direct aanleiding tot synchroniseren.
  # PR-code krijgt nooit projectschrijfrechten en wordt hieronder nooit uitgevoerd.
  pull_request:
    types: [opened, synchronize, reopened, closed]
  pull_request_review:
    types: [submitted, dismissed]
  issues:
    types: [opened, edited, labeled, unlabeled, closed, reopened, assigned, unassigned]
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

# Werk per kaart maar één keer tegelijk uit; nieuwe gebeurtenissen winnen.
# Een nieuw event op dezelfde kaart annuleert de vorige run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.issue.number || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Het standaard GITHUB_TOKEN heeft geen Organization Projects: write.
# Alleen de planner-App-token mag deze workflow projectmutaties laten doen.
permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  valideer-review-event:
    if: github.event_name == 'pull_request_review'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout vertrouwde validatietest
        uses: actions/checkout@v4
        with:
          ref: main
          sparse-checkout: test/review-guard.sh
          persist-credentials: false
      - name: Valideer review-event zonder projectmutatie
        run: bash test/review-guard.sh

  synchroniseer:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || github.event_name == 'pull_request_review' || github.event_name == 'issues' || (github.event_name == 'pull_request' && (github.event.action == 'opened' || github.event.action == 'synchronize' || github.event.action == 'reopened' || github.event.action == 'closed'))
    runs-on: ubuntu-latest
    steps:
      - name: Controleer Planner App-configuratie
        env:
          PLANNER_APP_ID: ${{ secrets.PLANNER_APP_ID }}
          PLANNER_PRIVATE_KEY: ${{ secrets.PLANNER_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "$PLANNER_APP_ID" || -z "$PLANNER_PRIVATE_KEY" ]]; then
            echo "::error::Planner App-tokenvoorziening ontbreekt. Rob/Kevin moet repository secrets PLANNER_APP_ID en PLANNER_PRIVATE_KEY configureren voor lxdg-dcs-planner." >&2
            exit 1
          fi

      - name: Maak token voor lxdg-dcs-planner
        id: planner-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.PLANNER_APP_ID }}
          private-key: ${{ secrets.PLANNER_PRIVATE_KEY }}
          owner: lxdg-technologies
          # Het bord is een organisatieproject: laat repositories daarom weg.
          # Vraag alleen de rechten die het vertrouwde synchronisatiescript gebruikt.
          permission-metadata: read
          permission-issues: write
          permission-pull-requests: write
          permission-organization-projects: write

      - name: Checkout scripts van main
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts/synchroniseer-projectbord.py
          # Ook na een merge gebruiken we uitsluitend de vertrouwde main-bron.
          ref: main
          persist-credentials: false

      - name: Synchroniseer kaarten
        env:
          GITHUB_TOKEN: ${{ steps.planner-token.outputs.token }}
        run: |
          set +e
          output=$(python3 .github/scripts/synchroniseer-projectbord.py 2>&1)
          status=$?
          set -e
          printf '%s\n' "$output"
          exit "$status"
