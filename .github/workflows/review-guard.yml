name: Review guard

on:
  pull_request:
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  pull-requests: read

jobs:
  review-guard-test:
    name: review-guard-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Head-versietest draaien
        run: bash test/review-guard.sh

  review-guard:
    name: review-guard
    runs-on: ubuntu-latest
    steps:
      - name: Controleer geldige technische goedkeuring
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail

          # DCS-Rob staat hier tijdelijk in als terugval, tot de reviewer-bot
          # aantoonbaar een pull request heeft goedgekeurd en review-guard daarna
          # groen werd. Daarna gaat DCS-Rob eruit: hij is de functionele
          # goedkeurder van Environment live, en zolang hij ook de technische
          # poort kan afvinken bestaat de scheiding tussen technische en
          # functionele review niet echt.
          allowed_logins='["lxdg-dcs-reviewer[bot]","DCS-Rob","vdbergkevin"]'

          reviews="$(gh api --paginate \
            "repos/$REPOSITORY/pulls/$PR_NUMBER/reviews" | jq -s 'add')"

          # COMMENTED is geen oordeel en overschrijft dus geen eerdere
          # APPROVED. Alleen de laatste inhoudelijke review per login telt.
          latest_reviews="$(jq '
            [
              .[]
              | select(
                  .state == "APPROVED"
                  or .state == "CHANGES_REQUESTED"
                  or .state == "DISMISSED"
                )
              | {
                  login: .user.login,
                  state: .state,
                  id: (.id // 0),
                  submitted_at: (.submitted_at // ""),
                  commit_id: (.commit_id // "")
                }
            ]
            | group_by(.login)
            | map(sort_by([.submitted_at, .id]) | last)
          ' <<< "$reviews")"

          self_approvals="$(jq --arg author "$PR_AUTHOR" --arg head_sha "$PR_HEAD_SHA" '
            [
              .[]
              | select(.state == "APPROVED" and .login == $author and .commit_id == $head_sha)
            ]
            | length
          ' <<< "$latest_reviews")"

          if [ "$self_approvals" -gt 0 ]; then
            echo "::error::De PR-auteur heeft deze PR zelf goedgekeurd; dat is niet toegestaan."
            exit 1
          fi

          valid_approvals="$(jq --argjson allowed "$allowed_logins" --arg head_sha "$PR_HEAD_SHA" '
            [
              .[]
              | select(
                  .state == "APPROVED"
                  and .commit_id == $head_sha
                  and (.login as $login | $allowed | index($login) != null)
                )
              | .login
            ]
            | unique
          ' <<< "$latest_reviews")"

          if [ "$(jq 'length' <<< "$valid_approvals")" -eq 0 ]; then
            old_approvals="$(jq --argjson allowed "$allowed_logins" --arg head_sha "$PR_HEAD_SHA" '
              [
                .[]
                | select(
                    .state == "APPROVED"
                    and .commit_id != $head_sha
                    and (.login as $login | $allowed | index($login) != null)
                  )
              ]
              | length
            ' <<< "$latest_reviews")"
            if [ "$old_approvals" -gt 0 ]; then
              echo "::error::Er is wel goedgekeurd, maar op een oudere versie van deze PR; de wijziging moet opnieuw bekeken en goedgekeurd worden."
            else
              echo "::error::Er is nog geen geldige goedkeuring van een toegestane reviewer op de actuele versie."
            fi
            echo "Toegestane logins: $(jq -r 'join(", ")' <<< "$allowed_logins")"
            exit 1
          fi

          echo "Laatste inhoudelijke reviews:"
          jq -r '.[] | "  \(.login): \(.state)"' <<< "$latest_reviews"
          echo "Geldige goedkeuring ontvangen van: $(jq -r 'join(", ")' <<< "$valid_approvals")"
